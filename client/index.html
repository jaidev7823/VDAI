<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Premiere Pro AI Agent</title>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
    <div id="main-container">
        <!-- Header -->
        <div id="header">
            <h1>Premiere Pro AI Agent</h1>
            <p>Control Premiere Pro with AI-powered automation</p>
        </div>

        <!-- Button Sections -->
        <div id="button-sections">
            <!-- Project Control Section -->
            <div class="section">
                <h2>Project Control</h2>
                <div class="button-group">
                    <button class="btn btn-primary" onclick="executeCommand('createNewProject')">New Project</button>
                    <button class="btn btn-secondary" onclick="executeCommand('openProject')">Open Project</button>
                    <button class="btn btn-success" onclick="executeCommand('saveProject')">Save Project</button>
                    <button class="btn btn-warning" onclick="executeCommand('closeProject')">Close Project</button>
                    <button class="btn btn-info" onclick="executeCommand('importFiles')">Import Files</button>
                    <button class="btn btn-primary" onclick="executeCommand('createBin')">Create Bin</button>
                </div>
            </div>

            <!-- Sequence Control Section -->
            <div class="section">
                <h2>Sequence Control</h2>
                <div class="button-group">
                    <button class="btn btn-primary" onclick="executeCommand('createSequence')">Create Sequence</button>
                    <button class="btn btn-secondary" onclick="executeCommand('getActiveSequence')">Get Active Sequence</button>
                    <button class="btn btn-info" onclick="executeCommand('setPlayheadPosition')">Set Playhead Position</button>
                    <button class="btn btn-warning" onclick="executeCommand('getPlayheadPosition')">Get Playhead Position</button>
                    <button class="btn btn-success" onclick="executeCommand('getSequenceSettings')">Get Sequence Settings</button>
                    <button class="btn btn-primary" onclick="executeCommand('createSequenceFromClips')">Create Sequence from Clips</button>
                    <button class="btn btn-danger" onclick="executeCommand('deleteSequence')">Delete Sequence</button>
                </div>
            </div>

            <!-- Clip and Track Operations Section -->
            <div class="section">
                <h2>Clip & Track Operations</h2>
                <div class="button-group">
                    <button class="btn btn-primary" onclick="insertClip()">Insert Clip</button>
                    <button class="btn btn-danger" onclick="removeClip()">Remove Clip</button>
                    <button class="btn btn-info" onclick="setInOutPoints()">Set In/Out Points</button>
                    <button class="btn btn-secondary" onclick="setClipStartEnd()">Set Start/End</button>
                    <button class="btn btn-warning" onclick="overwriteClip()">Overwrite Clip</button>
                    <button class="btn btn-success" onclick="moveClip()">Move Clip</button>
                    <button class="btn btn-info" onclick="duplicateClip()">Duplicate Clip</button>
                    <button class="btn btn-secondary" onclick="linkUnlinkClip()">Link/Unlink Clip</button>
                </div>
            </div>

            <!-- Effects and Transitions Section -->
            <div class="section">
                <h2>Effects & Transitions (QE API)</h2>
                <div class="button-group">
                    <button class="btn btn-primary" onclick="executeCommand('enableQE')">Enable QE API</button>
                    <button class="btn btn-warning" onclick="addVideoEffect()">Add Video Effect</button>
                    <button class="btn btn-success" onclick="addCropEffect()">Add Crop Effect</button>
                    <button class="btn btn-info" onclick="addTransition()">Add Transition</button>
                    <button class="btn btn-secondary" onclick="addAudioEffect()">Add Audio Effect</button>
                    <button class="btn btn-info" onclick="setEffectProperty()">Set Effect Property</button>
                    <button class="btn btn-danger" onclick="reflectQEMethods()">Reflect QE Methods</button>
                </div>
            </div>

            <!-- Export and Render Section -->
            <div class="section">
                <h2>Export & Render</h2>
                <div class="button-group">
                    <button class="btn btn-primary" onclick="encodeSequence()">Encode Sequence</button>
                    <button class="btn btn-info" onclick="launchEncoder()">Launch Media Encoder</button>
                    <button class="btn btn-danger" onclick="cancelJob()">Cancel Job</button>
                    <button class="btn btn-success" onclick="bindEncoder()">Bind Encoder</button>
                    <button class="btn btn-warning" onclick="unbindEncoder()">Unbind Encoder</button>
                    <button class="btn btn-secondary" onclick="removeJob()">Remove Job</button>
                </div>
            </div>

            <!-- Metadata and Automation Section -->
            <div class="section">
                <h2>Metadata & Automation</h2>
                <div class="button-group">
                    <button class="btn btn-primary" onclick="setColorLabel()">Set Color Label</button>
                    <button class="btn btn-info" onclick="getMediaPath()">Get Media Path</button>
                    <button class="btn btn-success" onclick="setMetadata()">Set Metadata</button>
                    <button class="btn btn-secondary" onclick="getPresetPath()">Get Preset Path</button>
                    <button class="btn btn-warning" onclick="getAppProperties()">Get App Properties</button>
                </div>
            </div>

            <!-- Diagnostics Section -->
            <div class="section">
                <h2>Diagnostics & Testing</h2>
                <div class="button-group">
                    <button class="btn btn-info" onclick="getProjectInfo()">Get Project Info</button>
                    <button class="btn btn-warning" onclick="testAPICompatibility()">Test API Compatibility</button>
                </div>
            </div>
        </div>

        <!-- Status Display -->
        <div id="status-section">
            <h3>Status</h3>
            <div id="status-display">Ready to execute commands...</div>
        </div>

        <!-- Chat Interface (Optional) -->
        <div id="chat-container" style="display: none;">
            <div id="chat-messages"></div>
            <div id="chat-input">
                <input type="text" id="message-input" placeholder="Type your message...">
                <button id="send-button">Send</button>
            </div>
        </div>
    </div>

    <script type="text/javascript" src="CSInterface.js"></script>
    <script type="text/javascript" src="index.js"></script>
</body>
</html>
